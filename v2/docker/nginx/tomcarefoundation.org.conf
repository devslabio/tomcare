# TOMCARE Foundation V2 — tomcarefoundation.org
# Website :3073, API /v1/ and /docs → :3072.
# For nginx on the host keep 127.0.0.1. For nginx in Docker on the "tomcare" network,
# use tomcare-web:3073 and tomcare-api:3072 instead.
# Certificate paths match the existing Let's Encrypt certificate (certbot renews it).

upstream tomcare_web { server 127.0.0.1:3073; }
upstream tomcare_api { server 127.0.0.1:3072; }

server {
    listen 80;
    listen [::]:80;
    server_name tomcarefoundation.org www.tomcarefoundation.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tomcarefoundation.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tomcarefoundation.org;

    ssl_certificate /etc/letsencrypt/live/tomcarefoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomcarefoundation.org/privkey.pem;

    return 301 https://tomcarefoundation.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tomcarefoundation.org;

    ssl_certificate /etc/letsencrypt/live/tomcarefoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomcarefoundation.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Image uploads are limited to 10 MB each by the API
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /v1/ {
        proxy_pass http://tomcare_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://tomcare_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tomcare_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
